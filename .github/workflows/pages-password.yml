# Modified for password-gated GitHub Pages deployment.
name: Deploy password-gated Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-password-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate access configuration
        env:
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          password = os.environ.get("ACCESS_PASSWORD", "")
          if not password:
              raise SystemExit("ACCESS_PASSWORD secret is required")
          path = Path("js/auth-config.js")
          content = path.read_text(encoding="utf-8")
          digest = hashlib.sha256(password.encode("utf-8")).hexdigest()
          content, count = re.subn(
              r"passwordHash:\s*'[^']*'",
              "passwordHash: '" + digest + "'",
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update password configuration")
          path.write_text(content, encoding="utf-8")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
