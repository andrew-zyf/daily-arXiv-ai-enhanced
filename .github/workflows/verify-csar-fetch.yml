name: Verify selected arXiv category
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/verify-csar-fetch.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CATEGORIES: ${{ secrets.CATEGORIES }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync
      - name: Verify category configuration
        run: |
          .venv/bin/python - <<'PY'
          import os
          assert os.environ["CATEGORIES"].strip() == "cs.AR", "Unexpected category configuration"
          print("Category configuration verified.")
          PY
      - name: Fetch and validate papers
        timeout-minutes: 22
        run: |
          .venv/bin/python daily_arxiv/fetch_weekly.py /tmp/arxiv-category-test.jsonl
          .venv/bin/python - <<'PY'
          import json
          with open("/tmp/arxiv-category-test.jsonl", encoding="utf-8") as f:
              rows = [json.loads(line) for line in f if line.strip()]
          assert rows, "No papers returned"
          assert all("cs.AR" in row["categories"] for row in rows), "Unexpected categories found"
          assert len(rows) == len({row["id"] for row in rows}), "Duplicate results"
          print(f"Validated {len(rows)} unique matching papers.")
          PY
