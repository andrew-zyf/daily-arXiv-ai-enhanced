# One-time integration check for weekly arXiv collection.
name: Verify weekly collection

on:
  push:
    paths:
      - .github/workflows/verify-weekly.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CATEGORIES: cs.AR,cs.RO,cs.CV,cs.LG,cs.OS,eess.SY
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync
          .venv/bin/python daily_arxiv/fetch_weekly.py /tmp/weekly.jsonl
          .venv/bin/python - <<'PY'
          import json
          with open("/tmp/weekly.jsonl", encoding="utf-8") as f:
              papers = [json.loads(line) for line in f if line.strip()]
          assert papers, "Expected at least one recent paper"
          assert all(p["id"] and p["title"] and p["summary"] for p in papers)
          assert len({p["id"] for p in papers}) == len(papers), "Duplicate paper IDs"
          print(f"Verified {len(papers)} complete, unique paper records.")
          PY
