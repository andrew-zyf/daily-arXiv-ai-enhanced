name: Diagnose arXiv endpoints
on:
  push:
    paths:
      - .github/workflows/diagnose-arxiv.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe arXiv endpoints
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error
          import time
          urls = [
              "https://export.arxiv.org/api/query?" + urllib.parse.urlencode({"search_query": "cat:cs.AR", "start": "0", "max_results": "1"}),
              "https://arxiv.org/api/query?" + urllib.parse.urlencode({"search_query": "cat:cs.AR", "start": "0", "max_results": "1"}),
              "https://arxiv.org/list/cs.AR/recent?show=25",
          ]
          for url in urls:
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      print(url, response.status, len(response.read(2048)), flush=True)
              except Exception as error:
                  print(url, type(error).__name__, str(error), flush=True)
              time.sleep(5)
          PY
